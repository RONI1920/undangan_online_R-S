<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' https://cykktrwcbtkcbvgqshiw.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#0f0f0f">
    <title>Admin Undangan A &amp; R</title>
    <link rel="icon" href="r-n.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css_admin.css">
</head>

<body>
    <main class="wrap">

        <!-- LOGIN -->
        <section id="login-view" class="panel narrow" hidden>
            <h1>Admin Undangan</h1>
            <p class="muted">Masuk untuk membuat dan mengelola link undangan tamu.</p>
            <form id="login-form" novalidate>
                <label for="email">Email</label>
                <input id="email" type="email" autocomplete="username" required>
                <label for="password">Kata sandi</label>
                <input id="password" type="password" autocomplete="current-password" required>
                <p id="login-msg" class="msg" role="alert"></p>
                <button type="submit" class="btn primary" id="login-btn">Masuk</button>
            </form>
        </section>

        <!-- PANEL -->
        <section id="app-view" hidden>
            <header class="topbar">
                <h1>📨 Admin Undangan Pernikahan</h1>
                <button type="button" class="btn small" id="logout-btn">Keluar</button>
            </header>

            <nav class="tabs" role="tablist">
                <button type="button" class="tab active" data-tab="guests" role="tab">👥 Tamu</button>
                <button type="button" class="tab" data-tab="rsvp" role="tab">✅ Kehadiran</button>
            </nav>

            <div id="tab-guests">
            <div class="panel">
                <h2>Tambah tamu</h2>
                <label for="listNama">Satu baris = satu tamu</label>
                <textarea id="listNama" rows="6" placeholder="Contoh:&#10;Bapak Ahmad&#10;Ibu Siti&#10;Saudara Budi"></textarea>
                <p id="add-msg" class="msg" role="status" aria-live="polite"></p>
                <button type="button" class="btn primary" id="add-btn">Simpan &amp; Buat Link</button>
            </div>

            <div class="panel">
                <div class="list-head">
                    <h2>Daftar tamu <span id="count" class="pill">0</span></h2>
                    <div class="actions">
                        <button type="button" class="btn small" id="copy-all">Salin semua pesan</button>
                        <button type="button" class="btn small" id="export-csv">Unduh CSV</button>
                        <button type="button" class="btn small" id="reload">Muat ulang</button>
                    </div>
                </div>
                <label for="search" class="visually-hidden">Cari tamu</label>
                <input id="search" type="search" placeholder="Cari nama tamu…" autocomplete="off">
                <div id="list" class="list" aria-live="polite"></div>
            </div>
            </div>

            <div id="tab-rsvp" hidden>
                <div class="stats">
                    <div class="stat ok"><b id="st-hadir">0</b><span>Hadir</span></div>
                    <div class="stat no"><b id="st-tidak">0</b><span>Tidak hadir</span></div>
                    <div class="stat maybe"><b id="st-mungkin">0</b><span>Mungkin</span></div>
                    <div class="stat all"><b id="st-orang">0</b><span>Total orang hadir</span></div>
                </div>
                <div class="panel">
                    <div class="list-head">
                        <h2>Konfirmasi tamu <span id="rsvp-count" class="pill">0</span></h2>
                        <div class="actions">
                            <button type="button" class="btn small" id="rsvp-csv">Unduh CSV</button>
                            <button type="button" class="btn small" id="rsvp-reload">Muat ulang</button>
                        </div>
                    </div>
                    <div class="seg" id="rsvp-filter">
                        <button type="button" class="active" data-f="all">Semua</button>
                        <button type="button" data-f="hadir">Hadir</button>
                        <button type="button" data-f="tidak">Tidak</button>
                        <button type="button" data-f="mungkin">Mungkin</button>
                    </div>
                    <label for="rsvp-search" class="visually-hidden">Cari</label>
                    <input id="rsvp-search" type="search" placeholder="Cari nama…" autocomplete="off">
                    <div id="rsvp-list" class="list" aria-live="polite"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js_admin.js"></script>
</body>

</html>
